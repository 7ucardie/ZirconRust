[package]
name = "mir-client"
description = "Game client for ZirconRust (winit + wgpu)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mir-formats = { path = "../mir-formats" }
mir-proto = { path = "../mir-proto" }
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
tracing.workspace = true
tracing-subscriber.workspace = true
bytemuck.workspace = true
winit = "0.30.13"
wgpu = "30.0.1"
glyphon = "0.12"
pollster = "0.4"
guillotiere = "0.7"
png = "0.18"
rodio = { version = "0.22", default-features = false, features = ["wav", "playback"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }
