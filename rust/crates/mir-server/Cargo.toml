[package]
name = "mir-server"
default-run = "mir-server"
description = "Game server for the Rust Zircon game"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mir-formats = { path = "../mir-formats" }
mir-proto = { path = "../mir-proto" }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
serde.workspace = true
serde_json = "1"
png = "0.18"
argon2 = { version = "0.5", features = ["std"] }
# NPC page scripts (Zircon NpcScriptEngine); vendored Lua 5.4 so CI needs no
# system Lua on any OS.
mlua = { version = "0.10", features = ["lua54", "vendored"] }
